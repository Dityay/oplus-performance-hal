[package]
name = "perf-service"
version = "1.0.0"
edition = "2021"

# lib: the node tables, the readers and the parcel structs (host-testable).
[lib]
name = "perf_service"
path = "src/lib.rs"

# bin: the Android AIDL HAL binary. The shipped artifact name has dashes and
# dots, so the build wraps the output (see ../../scripts/build_rust.sh).
[[bin]]
name = "perf_service"
path = "src/bin/perf_service.rs"

[profile.release]
opt-level = 2
debug = false
strip = "symbols"