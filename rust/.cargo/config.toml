# Rust port of the OPlus Performance HAL, built by rustc with the NDK clang
# linker. The NDK's libbinder_ndk.so / liblog.so stubs live in the sysroot for
# API 35.
[target.aarch64-linux-android]
linker = "/opt/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
rustflags = [
    "-C", "link-arg=-Wl,--no-undefined",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--build-id=none",
    "-C", "link-arg=-llog",
    # The platform libbinder_ndk.so, not the NDK stub: the stub only exports
    # the public API, but this service needs the platform-only
    # AServiceManager_addService / ABinderProcess_* entry points. The path is
    # relative to this crate; scripts/build_rust.sh links it to the copy in
    # the tree selected by ROM_TREE.
    "-C", "link-arg=../vendor-libs/libbinder_ndk.so",
]

[build]
target-dir = "target"